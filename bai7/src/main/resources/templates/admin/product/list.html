<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Quản lý sản phẩm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="app-bg">

<nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/products}">Admin Dashboard</a>

        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/products}" class="btn btn-nav">Trang user</a>
            <a th:href="@{/admin/products/create}" class="btn btn-success btn-sm px-3">+ Thêm sản phẩm</a>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-danger btn-sm px-3">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<section class="container py-4">
    <div class="page-header mb-4">
        <div>
            <h1 class="page-title">Quản lý sản phẩm</h1>
            <p class="page-subtitle">Thêm, sửa, xóa sản phẩm bằng giao diện quản trị.</p>
        </div>
    </div>

    <div class="filter-card mb-4">
        <form th:action="@{/admin/products}" method="get" class="row g-3">
            <div class="col-lg-10">
                <label class="form-label">Tìm kiếm</label>
                <input type="text" name="keyword" class="form-control" placeholder="Nhập tên sản phẩm..."
                       th:value="${keyword}">
            </div>

            <div class="col-lg-2 d-flex align-items-end">
                <button class="btn btn-dark w-100">Tìm</button>
            </div>
        </form>
    </div>

    <div class="admin-table-card">
        <div class="table-responsive">
            <table class="table align-middle mb-0 admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Ảnh</th>
                    <th>Tên</th>
                    <th>Giá</th>
                    <th>Danh mục</th>
                    <th class="text-center">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products.content}">
                    <td th:text="${p.id}"></td>
                    <td>
                        <img class="table-thumb"
                             th:src="${p.image}"
                             onerror="this.src='https://placehold.co/120x80?text=No+Image'">
                    </td>
                    <td class="fw-semibold" th:text="${p.name}"></td>
                    <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td th:text="${p.category != null ? p.category.name : 'Chưa phân loại'}"></td>
                    <td class="text-center">
                        <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-primary">Sửa</a>
                        <a th:href="@{/admin/products/delete/{id}(id=${p.id})}"
                           onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này?')"
                           class="btn btn-sm btn-danger">
                            Xóa
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="pagination-wrap mt-4" th:if="${products.totalPages > 0}">
        <a th:if="${products.hasPrevious()}"
           th:href="@{/admin/products(page=${products.number - 1}, keyword=${keyword})}"
           class="btn btn-outline-dark">
            Previous
        </a>

        <span class="page-indicator">
            Trang <strong th:text="${products.number + 1}">1</strong>
            /
            <strong th:text="${products.totalPages}">1</strong>
        </span>

        <a th:if="${products.hasNext()}"
           th:href="@{/admin/products(page=${products.number + 1}, keyword=${keyword})}"
           class="btn btn-outline-dark">
            Next
        </a>
    </div>
</section>

</body>
</html>
