<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form sản phẩm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="app-bg">

<nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/products}">Admin Dashboard</a>

        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/admin/products}" class="btn btn-nav">Danh sách sản phẩm</a>
            <a th:href="@{/products}" class="btn btn-nav">Trang user</a>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-danger btn-sm px-3">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<section class="container py-4">
    <div class="page-header mb-4">
        <div>
            <h1 class="page-title">Thêm / cập nhật sản phẩm</h1>
            <p class="page-subtitle">Dùng link ảnh trực tiếp thay vì file tĩnh.</p>
        </div>
    </div>

    <div class="form-card">
        <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="mb-3">
                        <label class="form-label">Tên sản phẩm</label>
                        <input type="text" th:field="*{name}" class="form-control" placeholder="Ví dụ: Laptop Dell XPS 13">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Giá</label>
                        <input type="number" th:field="*{price}" class="form-control" placeholder="Ví dụ: 25000000">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Link ảnh</label>
                        <input type="url"
                               th:field="*{image}"
                               id="imageInput"
                               class="form-control"
                               placeholder="https://example.com/product.jpg"
                               oninput="updatePreview()">
                        <div class="form-text">
                            Dán link ảnh từ internet. Ví dụ: ảnh từ Unsplash, Pexels, website demo...
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Danh mục</label>
                        <select name="categoryId" class="form-select">
                            <option value="">Chọn danh mục</option>
                            <option th:each="c : ${categories}"
                                    th:value="${c.id}"
                                    th:text="${c.name}"
                                    th:selected="${currentCategoryId != null and currentCategoryId == c.id}">
                            </option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-dark px-4">Lưu sản phẩm</button>
                        <a th:href="@{/admin/products}" class="btn btn-outline-secondary px-4">Quay lại</a>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="preview-card">
                        <div class="preview-title">Xem trước ảnh</div>
                        <img id="previewImage"
                             class="preview-image"
                             th:src="${product.image != null and !#strings.isEmpty(product.image)} ? ${product.image} : 'https://placehold.co/600x400?text=Preview+Image'"
                             onerror="this.src='https://placehold.co/600x400?text=Preview+Image'">
                    </div>
                </div>
            </div>
        </form>
    </div>
</section>

<script>
    function updatePreview() {
        const input = document.getElementById('imageInput');
        const preview = document.getElementById('previewImage');
        const value = input.value.trim();

        if (value === '') {
            preview.src = 'https://placehold.co/600x400?text=Preview+Image';
        } else {
            preview.src = value;
        }
    }
</script>

</body>
</html>
