<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="app-bg">

<nav class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/products}">Bai7 Shop</a>

        <div class="ms-auto d-flex align-items-center gap-2">
            <a th:href="@{/products}" class="btn btn-nav">Tiếp tục mua</a>

            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-danger btn-sm px-3">Đăng xuất</button>
            </form>
        </div>
    </div>
</nav>

<section class="container py-4">
    <div class="page-header mb-4">
        <div>
            <h1 class="page-title">Giỏ hàng của bạn</h1>
            <p class="page-subtitle">Kiểm tra lại sản phẩm, số lượng và thanh toán.</p>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(cartItems)}" class="empty-state">
        Giỏ hàng đang trống.
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(cartItems)}">
        <div class="col-lg-8">
            <div class="admin-table-card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0 admin-table">
                        <thead>
                        <tr>
                            <th>Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Giá</th>
                            <th>Số lượng</th>
                            <th>Thành tiền</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td>
                                <img class="table-thumb"
                                     th:src="${item.image}"
                                     onerror="this.src='https://placehold.co/120x80?text=No+Image'">
                            </td>
                            <td class="fw-semibold" th:text="${item.name}"></td>
                            <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td>
                                <form th:action="@{/cart/update}" method="post" class="d-flex gap-2">
                                    <input type="hidden" name="productId" th:value="${item.productId}">
                                    <input type="number" name="quantity" min="1"
                                           th:value="${item.quantity}"
                                           class="form-control"
                                           style="width: 90px;">
                                    <button class="btn btn-sm btn-primary">Cập nhật</button>
                                </form>
                            </td>
                            <td th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td>
                                <a th:href="@{/cart/remove/{id}(id=${item.productId})}" class="btn btn-sm btn-danger">Xóa</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="summary-card">
                <h4 class="summary-title">Tóm tắt đơn hàng</h4>

                <div class="summary-line">
                    <span>Số sản phẩm</span>
                    <strong th:text="${#lists.size(cartItems)}">0</strong>
                </div>

                <div class="summary-line total">
                    <span>Tổng thanh toán</span>
                    <strong th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></strong>
                </div>

                <form th:action="@{/order/checkout}" method="post" class="d-grid mt-3">
                    <button class="btn btn-dark btn-lg">Đặt hàng</button>
                </form>

                <div class="d-grid gap-2 mt-3">
                    <a th:href="@{/cart/clear}" class="btn btn-outline-danger">Xóa toàn bộ giỏ</a>
                    <a th:href="@{/products}" class="btn btn-outline-secondary">Tiếp tục mua</a>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
